name: Deploy GuadeX 3-D viewer

# Builds viz/ and publishes it to GitHub Pages. No server is required: the app
# is fully static.
#
# The raw GIS sources in data/ are tracked with Git LFS (*.shp, *.csv), and
# actions/checkout does not fetch LFS objects by default. Rather than pull
# ~100 MB of LFS objects on every push, this workflow builds from the already
# generated and committed viz/public/data. To refresh the site's data, run
# `npm run data` locally in viz/ and commit viz/public/data, then push.
#
# One-time setup: Settings -> Pages -> Build and deployment ->
# Source = "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - 'viz/**'
      - '.github/workflows/deploy-viz.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viz/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify committed web data is present
        run: |
          test -f public/data/manifest.json || { echo "Missing viz/public/data — run 'npm run data' locally and commit it."; exit 1; }

      - name: Run logic smoke tests
        run: npm run smoke

      - name: Build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: viz/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
