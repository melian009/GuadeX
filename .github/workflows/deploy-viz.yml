name: Deploy GuadeX 3-D viewer

# Builds viz/ (regenerating the web data from the tracked GIS sources) and
# publishes it to GitHub Pages. No server is required: the app is static.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source =
# "GitHub Actions". Then push to master (or run this workflow manually).

on:
  push:
    branches: [master]
    paths:
      - 'viz/**'
      - 'data/**'
      - '.github/workflows/deploy-viz.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viz/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web data from GIS sources
        run: npm run data

      - name: Run logic smoke tests
        run: npm run smoke

      - name: Build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: viz/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
