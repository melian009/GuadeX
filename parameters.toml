# =============================================================================
# GuadeX simulation parameters
#
# This is the single source of truth for run settings across the maintained
# entry scripts:
#
#   scripts/run_model.jl
#   scripts/run_sensitivity.jl
#   run_sensitivity_report.jl
#   run_alt_interactions.jl
#
# Library defaults in src/data_preparation.jl are intentionally unchanged;
# the scripts read their values from this file instead.
#
# To change an experiment, edit this file.  For a fully tracked experiment,
# copy it (e.g. parameters_2026_09_experiment_a.toml), edit the copy, and run
# with GUADEX_PARAMETERS_FILE=<path>.  Individual values can still be
# overridden per run with the GUADEX_* environment variables documented in
# docs/updated_inputs_simulations.md.
# =============================================================================

[general]
# Time configuration: 1 time unit = 1 day.
days_per_year = 365

# ---------------------------------------------------------------------------
# Updated 2045 inputs shared by all scripts.
# ---------------------------------------------------------------------------

[inputs]
# CEDEX basin-level 2045 projection table (hydrological indicators, not
# temperatures).  Loaded for provenance and scenario selection.
cedex_var_file = "data/2045_CEDEX_GUADALQUIVIR_VAR.csv"

# CEDEX 2045 seasonal runoff projections per UTS.  Loaded for provenance and
# scenario selection.
cedex_esc_uts_file = "data/2045_CEDEX_GUADALQUIVIR_ESC_por_UTS.csv"

# 2026 inventory of obstacles that are not completely passable.
obstacles_file = "data/obstacles_1658_Obstaculos_No_Completamente_Franqueables _2026-02-16_Guadex.csv"

[obstacles]
# "legacy" disables the spatial obstacle overlay; "overlay" applies it.
mode = "overlay"

# Obstacles closer than this (metres) to a straight line segment between two
# connected sites are assigned to that segment.
matching_tolerance_m = 2000.0

# Passability applied to movement towards the higher-elevation (upstream) site.
# This is the limiting direction.
upstream_passability = 0.1

# Passability applied to movement towards the lower-elevation (downstream)
# site.  Reduced but more accessible than upstream.
downstream_passability = 0.5

# ---------------------------------------------------------------------------
# Dispersal-graph construction (issue C4).
#
# "legacy" keeps the original within-sub-catchment chaining plus elevation
# outlet chain (the default, so existing results are reproduced unchanged).
# "on_path" rebuilds a dendritic tree from the network-distance matrix with the
# on-path parent rule and an MST join of the roots.
# ---------------------------------------------------------------------------
# "on_path" uses the code defaults rtol = 0.02, atol = 200 m for the on-path
# test |D(i,k) - (d(i) - d(k))| <= rtol*D(i,k) + atol (see prepare_ode_data).
[connectivity]
method = "legacy"

# ---------------------------------------------------------------------------
# Species groups used to classify simulation outputs.
#
# `native` includes ST (Salmo trutta), the cold-water keystone whose empirical
# thermal optimum (12 C, range 4-20 C) lies *below* current basin temperatures:
# it is the native species through which warming can appear as a decline.
# `migratory` holds the diadromous / estuarine species (AA, LR, MC) that are
# neither native-resident nor invasive; they are reported separately and are not
# part of the native richness metric.  AAL (Alburnus alburnus, bleak) is an
# exotic (EX) species and is grouped with the invasive/exotic taxa; its limited
# upstream spawning movements are weaker than those of the native barbel (LS),
# so it is not treated as a migratory taxon.
# ---------------------------------------------------------------------------

[species]
native = ["AB", "AH", "SP", "PW", "LS", "SA", "IL", "CP", "IO", "ST"]
invasive = ["GH", "MS", "LG", "CC", "CG", "AM", "OM", "EL", "GL", "TT", "AAL"]
migratory = ["AA", "LR", "MC"]

# ---------------------------------------------------------------------------
# Explicit, opt-in biological-assumption options (E13-E16, E18).
#
# EVERY option defaults to the behaviour the model had before the option existed,
# so the shipped configuration and the test suite reproduce the historical
# results exactly.  These are decision options for the team, not calibrated
# values; see docs/climate_scenarios.md for the trade-offs.  Changing any value
# changes the parameter digest, so cached burn-ins and completed runs are
# invalidated rather than silently reused.
# ---------------------------------------------------------------------------

[biological_options]
# E13 — fraction of the local growth rate given to a species observed ABSENT at
# a site (build_intrinsic_growth_rates).  0.1 is the historical default.  1.0
# removes the presence penalty so temperature/habitat decide establishment (the
# review's recommendation); 0.0 forbids local growth at absent sites.  Note the
# interaction with E15/E16 below.
absence_growth_fraction = 0.1

# E14 — carrying capacity at isolated pools (EN_POZAS = Si; 84 sites holding
# ~56% of total density).  "legacy" uses their raw observed density; "cap" clips
# a pool site's K at the non-pool median; "exclude" replaces it with that median
# so a single-visit pool sample cannot set the capacity.  The choice strongly
# affects the reported high-K tail.
pool_capacity_mode = "legacy"

# E15 — carrying capacity at sites the field team judged unable to hold fish
# (SIN_PECES = DIFICIL; 56 sites).  "legacy" keeps their observed capacity;
# "near_zero" sets K = 1e-6 (the ODE's own floor), making them transit-only.
fishless_dificil_capacity = "legacy"

# E16 — local growth of species documented as not reproducing within the basin
# (AA, LR, MC with REPRODU_WITHIN_THE_BASIN = no).  "legacy" keeps their
# literature r; "zero" sets local r = 0, with recruitment to be represented
# later as estuarine immigration.
nonreproducing_local_growth = "legacy"

# E16 — drop the four documented Guadiato fish-farm eel records (subcatchment
# 14.0) before any builder reads the density table.  Default false keeps them.
exclude_fishfarm_eel_records = false

# E18 — apply a brackish/freshwater envelope for strictly brackish species
# (AB, LR, MC) using the site CONDUCTIVIDAD as a salinity proxy: their local
# growth is zeroed below 1000 uS/cm.  Euryhaline brackish/freshwater species
# (AA, GH, CC, CG) are left unchanged because the observed data place them
# across the conductivity range.  No elevation envelope is provided on purpose:
# a static elevation envelope would block upslope range shifts under warming.
salinity_envelope = false

# ---------------------------------------------------------------------------
# Modelled subcatchments.  Exploitation and passability scenarios apply one
# factor per subcatchment; sites in unlisted subcatchments receive 1.0.
# ---------------------------------------------------------------------------

[subcatchments]
all = [1.1, 1.2, 1.3, 1.4, 2.2, 3.0, 6.0, 7.0, 9.0, 10.0, 11.3, 11.5, 11.2, 11.1, 11.4, 12.0, 13.3, 13.2, 13.1, 14.0, 15.2, 15.1, 16.0, 17.0, 18.1, 18.3, 18.2, 19.0, 20.0, 21.0, 22.1, 22.4, 22.2, 23.0, 24.1, 24.2, 25.0, 26.1, 26.2, 26.3, 26.4, 26.5, 26.6, 27.0, 28.1, 28.2, 28.3, 28.4, 29.0, 30.1, 30.2, 30.3, 30.4, 30.5, 30.6, 30.7, 31.0, 32.4, 32.3, 32.1, 32.2, 33.0, 34.1, 34.2, 34.3, 34.4, 35.0, 36.1, 36.2, 36.3, 36.4, 37.0, 38.0, 39.0, 40.1, 40.2, 41.0]

# ---------------------------------------------------------------------------
# Scenario library.
#
# Exploitation scenarios: factors < 1.0 reduce the intrinsic growth rate of a
# site (harvesting/mortality); 1.0 = no exploitation (baseline).
# Passability scenarios: multipliers applied to the dam/obstacle passability of
# a site; 1.0 = baseline, > 1.0 = improved passage, < 1.0 = reduced passage.
#
# A scenario has a uniform `factor` applied to every subcatchment and may add a
# per-subcatchment `overrides` table for heterogeneous scenarios, e.g.
#
#   [scenarios.exploitation.fish_refuge]
#   factor = 1.0
#   [scenarios.exploitation.fish_refuge.overrides]
#   "3.1" = 0.7
#   "4.2" = 0.5
# ---------------------------------------------------------------------------

[scenarios.exploitation]
baseline = { factor = 1.0 }
low_exploitation = { factor = 0.9 }
medium_exploitation = { factor = 0.7 }
high_exploitation = { factor = 0.5 }
example_exploitation = { factor = 0.9 }

[scenarios.passability]
baseline = { factor = 1.0 }
improved_passability = { factor = 1.5 }
reduced_passability = { factor = 0.5 }
blocked = { factor = 0.1 }
example_passability = { factor = 1.0 }

# ---------------------------------------------------------------------------
# Entry script settings.
#
# Each maintained entry script reads its own section.  The sensitivity scripts
# sweep over the listed grids and scenario names; run_model.jl applies a single
# exploitation and passability scenario.
# ---------------------------------------------------------------------------

[run_model]
simulation_years = 1
upstream_cost = 0.05
exploitation_scenario = "example_exploitation"
passability_scenario = "example_passability"

[run_sensitivity]
simulation_years = 1
upstream_costs = [0.01, 0.05, 0.1, 0.5]
exploitation_scenarios = ["baseline", "low_exploitation", "medium_exploitation", "high_exploitation"]
passability_scenarios = ["baseline", "improved_passability", "reduced_passability", "blocked"]

# ---------------------------------------------------------------------------
# Obstacle / upstream-cost sensitivity: shared climate-consistent settings.
#
# These reproduce the `climate_scenarios_k1x_burnin` configuration (per-GCM
# daily water temperature, seasonal baseline burn-in, calibrated heat stress,
# effective K = 1x observed, WP0 species classification).  Both
# `run_sensitivity_report.jl` and `run_alt_interactions.jl` read this section,
# so the two sweeps are directly comparable.  Per-run overrides use the
# GUADEX_SENSITIVITY_* environment variables (and GUADEX_SPINUP_* for the cache).
# ---------------------------------------------------------------------------

[obstacle_sensitivity]
start_year = 2026
end_year = 2045
save_interval_days = 30.4167
presence_threshold = 0.1
daily_forcing_file = "guadex_tw/outputs/tables/water_temp_daily_guadex_sites_wide.csv"
baseline_period_start = 1986
baseline_period_end = 2005
carrying_capacity_base_scaling = 1.0
carrying_capacity_scaling = 1.0
thermal_optima_fraction = 0.5
spin_up = true
spin_up_max_years = 600
spin_up_tol = 5.0e-5
# E4 stop rule: require BOTH the basin-total change (below `spin_up_tol`) and the
# robust composition change (95th percentile of |Δ log N| over the site × species
# cells whose density exceeds the 0.1-unit presence floor in at least one of the
# two compared years, below `spin_up_composition_tol`) for at least
# `spin_up_min_years` years.  The raw all-cells statistic is recorded as a
# diagnostic but is not used by the stop rule.
spin_up_criterion = "both"
# 1e-2: measured robust statistic on real baseline data crosses this at ~yr 423
# (<600 cap); the raw all-cells statistic plateaus near 1.4e-2 and never reaches
# 1e-3, so it cannot be used as the stop tolerance.
spin_up_composition_tol = 1.0e-2
spin_up_min_years = 10
spin_up_progress_every = 50
heat_stress_enabled = true
heat_stress_calibrate = true
heat_stress_max_loss = 0.05
quasi_extinction_q = 0.1
quasi_extinction_persistence = 3
upstream_cost = 0.05
output_dir = "results/sensitivity_obstacles"

# The two temperature extremes of the 44-run climate ensemble, used as the
# background climate for every obstacle/passability combination.  Each entry is
# a scenario x GCM pair; the per-GCM daily files are read directly.
#
# C7: these are the fallback pair.  Re-derive them from the realised forcing on
# the next re-run with `Guadex.select_climate_endpoints(runs_index)` (see
# docs/climate_scenarios.md) and update this list; the function falls back to
# this pair only when the realised columns are absent.
climate_models = [
    { scenario = "ssp126", gcm = "IITM-ESM" },     # coolest run (0.28 degC by 2045)
    { scenario = "ssp245", gcm = "UKESM1-0-LL" },  # warmest run (1.37 degC by 2045)
]

# ---------------------------------------------------------------------------
# Obstacle / upstream-cost sweep (run_sensitivity_report.jl).
#
# Sweeps the upstream dispersal cost x passability scenario under each of the
# `obstacle_sensitivity.climate_models` above.  No exploitation is applied.
# ---------------------------------------------------------------------------

[run_sensitivity_report]
upstream_costs = [0.01, 0.05, 0.1, 0.5]
passability_scenarios = ["baseline", "improved_passability", "reduced_passability", "blocked"]

# ---------------------------------------------------------------------------
# Alternative-interaction sweep (run_alt_interactions.jl).
#
# Adds the interaction-matrix and thermal-sigma uncertainty axes on top of the
# same obstacle/upstream-cost sweep, so it answers "is the passability signal
# robust to the interaction structure / thermal breadth?".
# ---------------------------------------------------------------------------

[run_alt_interactions]
thermal_sigma_multiplier = 0.3
upstream_costs = [0.01, 0.5]
passability_scenarios = ["baseline", "improved_passability", "reduced_passability", "blocked"]

# ---------------------------------------------------------------------------
# E7 — Global sensitivity (Latin hypercube + Sobol indices).
#
# Complements the within-design factor ranking in
# `scripts/plot_sensitivity_effects.jl` (which is valid only inside one balanced
# full-factorial sweep).  This block defines the *global* design over documented
# parameter ranges; the within-design ranking is kept unchanged alongside it.
#
# The ranges below are the DEFAULT PROPOSAL assembled from the correction plan
# and the source data's own uncertainty.  The team must confirm them before the
# production index is quoted: they are an interpretation of the literature /
# data uncertainty, not calibrated posteriors.  See
# docs/global_sensitivity_methods_note.md for the rationale, the estimator
# validation against Ishigami, and the production compute estimate
# (N*(2D+2) model runs with D = 8).
#
# This section is read only by scripts/global_sensitivity_sobol.jl; every
# existing entry script ignores it, so no existing default changes.
# ---------------------------------------------------------------------------

[global_sensitivity]
# Production defaults (labelled PILOT when overridden smaller by the runner).
# The number of base samples N; the Saltelli design needs N*(2D+2) evaluations.
# N = 512 with D = 8 is 9216 model runs — plan compute accordingly.
n_samples = 512
bootstrap = 1000
seed = 20261001
threshold = 0.1
# Base heat-stress slope k used by the global-sensitivity runner (the sampled
# `heat_stress_k_multiplier` scales it).  This is the WP3-calibrated value
# recorded by the corrected obstacle-sensitivity runs
# (results/sensitivity_obstacles_corrected/.../run_metadata.json:
# heat_stress_k = 3.81183578844573e-05).  Override with GUADEX_GS_HEAT_K, or
# recompute from the daily forcing with GUADEX_GS_CALIBRATE_HEAT=1.
heat_stress_k_base = 3.81183578844573e-05
metric_names = [
    "basin_native_biomass",
    "basin_native_richness",
    "basin_realised_richness_loss",
]
# Reduced configuration used by `GUADEX_GS_MODE=pilot` (a few minutes, clearly
# not the production index): fewer sites, one year, a small N.
pilot_n_samples = 128
pilot_bootstrap = 200
pilot_max_sites = 80
pilot_sim_years = 1

# --- Agreed-range proposal (team to confirm) -------------------------------
# Each entry: name, lower, upper, default, rationale.  The `name` selects the
# transform applied by the driver (see scripts/global_sensitivity_sobol.jl).
[[global_sensitivity.parameters]]
name = "growth_multiplier"
lower = 0.75
upper = 1.25
default = 1.0
rationale = "Global multiplier on every local intrinsic growth rate r. The literature r-values (Fish Growth and Dispersal Data Request) span roughly +/-25% across source populations; a symmetric multiplier braces that uncertainty without re-fitting each species."
[[global_sensitivity.parameters]]
name = "carrying_capacity_scaling"
lower = 0.5
upper = 2.0
default = 1.0
rationale = "Multiplier on the observed-density carrying capacity K. The E14 isolated-pool distortion (84 pools, ~56% of basin density, max K ~95,333) means the capacity level is the least certain state variable; 0.5x-2x brackets the realistic range around the k1x baseline."
[[global_sensitivity.parameters]]
name = "interaction_strength_multiplier"
lower = 0.5
upper = 1.5
default = 1.0
rationale = "Multiplier on every pairwise interaction coefficient alpha. The interaction matrix is qualitative (displaces=-0.8, predation=-0.5, competition=-0.3); a 0.5x-1.5x factor propagates that coding uncertainty without changing any sign."
[[global_sensitivity.parameters]]
name = "thermal_optimum_shift_c"
lower = -2.0
upper = 2.0
default = 0.0
rationale = "Uniform shift (degC) added to every species' thermal optimum. Trait-table optima are range midpoints; C6 notes the baseline sites are all <= 18.37 degC, so a +/-2 degC shift covers the physiological-niche uncertainty under warming."
[[global_sensitivity.parameters]]
name = "thermal_breadth_multiplier"
lower = 0.6
upper = 1.4
default = 1.0
rationale = "Multiplier on every thermal sigma. Sigma is approximated as range/6 from the trait table (C6); 0.6x-1.4x brackets the curvature/width uncertainty of the Gaussian thermal filter."
[[global_sensitivity.parameters]]
name = "dispersal_multiplier"
lower = 0.5
upper = 2.0
default = 1.0
rationale = "Multiplier on the precomputed dispersal matrix (all species together). Species dispersal rates carry order-of-magnitude literature ranges (E17); the base matrix uses the median species rate, so this factor spans the credible turnover-speed range."
[[global_sensitivity.parameters]]
name = "upstream_cost"
lower = 0.01
upper = 0.5
default = 0.05
rationale = "Upstream movement cost c in the dispersal kernel 1/(1 + c*delevation). The existing obstacle sweep uses exactly the grid {0.01, 0.05, 0.1, 0.5}; the global design treats it continuously over that same agreed interval."
[[global_sensitivity.parameters]]
name = "heat_stress_k_multiplier"
lower = 0.0
upper = 2.0
default = 1.0
rationale = "Multiplier on the calibrated heat-stress slope k (0 disables the term). k is calibrated to a max_annual_loss = 0.05 assumption (WP3); 0x-2x propagates that calibration choice, including the disable case."

# ---------------------------------------------------------------------------
# Climate-driven runs (run_climate_scenarios.jl).
#
# The simulation starts at the current year and integrates daily to `end_year`
# (BP horizon 2045), with a year-by-year warming trajectory interpolated from
# the guadex_tw water-temperature projections, for every GCM x SSP.  States are
# saved monthly (30 days) to keep outputs small while retaining annual and
# seasonal metrics.
# ---------------------------------------------------------------------------

[run_climate_scenarios]
start_year = 2026
end_year = 2045
# 365/12 = 30.4167 days, so monthly snapshots land exactly on year boundaries.
save_interval_days = 30.4167
elevation_scaling = false
presence_threshold = 0.1
upstream_cost = 0.05
# Generate the four-level / ensemble figures after the run (env GUADEX_CLIMATE_PLOT=0 disables).
make_figures = true
# Output root for the runs (env GUADEX_CLIMATE_OUTPUT_DIR overrides).
output_dir = "results/climate_scenarios"
temperature_projections_file = "guadex_tw/outputs/tables/water_temp_future_2045.csv"
scenarios = ["ssp126", "ssp245", "ssp370", "ssp585"]
gcms = [
    "ACCESS-CM2", "CMCC-CM2-SR5", "CNRM-ESM2-1", "EC-Earth3-Veg", "IITM-ESM",
    "KACE-1-0-G", "MIROC6", "MPI-ESM1-2-HR", "MRI-ESM2-0", "NorESM2-MM",
    "UKESM1-0-LL",
]

# --- WP2: forcing mode -----------------------------------------------------
# "annual_mean" reproduces the historical annual-node warming curve (default);
# "daily" uses a per-site daily water-temperature forcing file (WP1).
forcing_mode = "annual_mean"
daily_forcing_file = "guadex_tw/outputs/tables/water_temp_daily_guadex_sites_wide.csv"
# Use the per-(scenario, GCM) wide files (<base>_<scenario>_<gcm>.csv) so the
# ensemble carries GCM spread instead of the ensemble-median product.
daily_forcing_per_gcm = false
# Baseline period for daily anomalies (PNACC convention).
baseline_period_start = 1986
baseline_period_end = 2005
# Add a no-warming control run (baseline climatology over the horizon) so
# scenario effects can be reported relative to it (WP4).
control_run = false

# --- WP4: spun-up initial conditions / carrying-capacity sensitivity --------
spin_up = false
spin_up_max_years = 50
spin_up_tol = 1.0e-6
# Stop rule for the burn-in (E4): "both" (default, strictest) requires the
# basin-total change below `spin_up_tol` AND the robust composition change below
# `spin_up_composition_tol`; "basin" reproduces the legacy basin-only rule;
# "q95"/"max" are the legacy per-site total-change rules.
spin_up_criterion = "both"
# Composition tolerance: robust 95th percentile of |Δ log N| over the ACTIVE
# site × species cells (density above the 0.1-unit presence floor in at least one
# of the two compared years).  The floor excludes near-extinct/flickering cells
# that otherwise dominate the percentile; see src/spin_up.jl.
spin_up_composition_tol = 1.0e-2
# Minimum number of one-year blocks before convergence may be declared.
spin_up_min_years = 10
# Print a burn-in progress line every N year-blocks (0 disables).
spin_up_progress_every = 50
# Multiplier linking observed total density to the base carrying capacity
# (build_carrying_capacity).  10.0 = legacy "10x observed"; 1.0 = the observed
# snapshot is the capacity level.  The effective multiplier is
# carrying_capacity_base_scaling * carrying_capacity_scaling.
carrying_capacity_base_scaling = 10.0
carrying_capacity_scaling = 1.0
# WP3 optimum sweep: 0.0 = cold edge, 0.5 = midpoint (default), 1.0 = warm edge.
thermal_optima_fraction = 0.5

# --- WP5: quasi-extinction --------------------------------------------------
quasi_extinction_q = 0.1
quasi_extinction_persistence = 3

# [temperature_stress] below controls WP3: when `enabled = false` the ODE is the
# pre-WP3 model regardless of `k`.

# ---------------------------------------------------------------------------
# WP3 heat-stress mortality.  `k` is the single shared slope (1/day/degC^2);
# `enabled = false` disables the term (and preserves the old model).  When
# `calibrate = true` the run script derives `k` from the baseline exceedance
# energy so that the worst observed baseline species/site loses at most
# `max_annual_loss` per year.
# ---------------------------------------------------------------------------

[temperature_stress]
enabled = false
k = 0.0
calibrate = true
max_annual_loss = 0.05
limits_source = "trait_table"

# ---------------------------------------------------------------------------
# Staged experiment driver (run_climate_experiments.jl, WP6).
#
# Stages, cheapest first; each stage gates the next:
#   E0 spinup     - spun-up state vs observed (realism check)
#   E1 seasonality- baseline annual-mean vs daily forcing
#   E2 heat       - heat-stress on/off
#   E3 k          - carrying-capacity sensitivity {1x, 3x, 10x}
#   E4 optimum    - thermal-optimum sweep across the empirical range
#   E5 ensemble   - full GCM x SSP run (delegated to run_climate_scenarios.jl)
# ---------------------------------------------------------------------------

[run_climate_experiments]
stages = ["E0", "E1", "E2", "E3", "E4"]
start_year = 2026
end_year = 2045
scenario = "ssp585"
gcms = ["ACCESS-CM2", "CMCC-CM2-SR5", "CNRM-ESM2-1", "EC-Earth3-Veg", "IITM-ESM",
    "KACE-1-0-G", "MIROC6", "MPI-ESM1-2-HR", "MRI-ESM2-0", "NorESM2-MM",
    "UKESM1-0-LL"]
# E3 carrying-capacity multipliers and E4 optimum positions within the range.
# The effective multiplier against observed density is
# carrying_capacity_base_scaling * k_scaling_grid[k], and both are recorded per case.
carrying_capacity_base_scaling = 10.0
k_scaling_grid = [1.0, 3.0, 10.0]
optimum_fractions = [0.0, 0.25, 0.5, 0.75, 1.0]
spin_up_max_years = 50
spin_up_tol = 1.0e-6
# E4 stop rule for the staged driver: "both" (basin + robust composition) is the
# stricter default; set "basin" to reproduce the pre-E4 single-criterion rule.
spin_up_criterion = "both"
spin_up_composition_tol = 1.0e-2
spin_up_min_years = 10
output_dir = "results/climate_experiments"
temperature_projections_file = "guadex_tw/outputs/tables/water_temp_future_2045.csv"
daily_forcing_file = "guadex_tw/outputs/tables/water_temp_daily_guadex_sites_wide.csv"
