# =============================================================================
# GuadeX parameters — CORRECTED climate re-run configuration
#
# THIS is the configuration that drives the CORRECTED re-run (post the
# C1/C2/C5/C7/E4 fixes).  It is a copy of the September
# `legacy/parameters_climate_scenarios_k1x_burnin.toml` with the legacy stop rule and
# PINNED heat-stress slope replaced by the corrected settings:
#
#   [run_climate_scenarios]  daily per-GCM forcing, K = 1x observed, control run,
#                            C3 interim projection route (observed start + short
#                            spin-up, reported as scenario-control deltas),
#                            output_dir = results/climate_scenarios_corrected
#   [obstacle_sensitivity]   the C3 interim projection route (observed start +
#                            short fixed spin-up) shared with the climate run,
#                            and NEW output directories, so the obstacle and
#                            interaction sweeps initialise from the SAME
#                            corrected state as the climate ensemble and do not
#                            overwrite the legacy September sweep outputs
#   [temperature_stress]     heat stress enabled and CALIBRATED from the
#                            corrected baseline (`calibrate = true`)
#   [biological_options]     the six TEAM-CHOSEN values (E13-E16, E18); the
#                            generic `parameters.toml` keeps the legacy defaults
#
# Under the C3 interim route the [run_climate_scenarios] E4 stop-rule keys above
# are NOT used (they apply to `projection_route = "full_burnin"`, the default for
# every other configuration).  The [obstacle_sensitivity] section below selects
# the SAME interim route for the sweeps, so its E4 stop-rule keys are likewise
# inactive there and are retained only for a `full_burnin` re-run.
#
# The corrected climate runs write to `results/climate_scenarios_corrected`, and
# the corrected sweeps to `results/sensitivity_obstacles_corrected` and
# `results/alt_interactions_corrected` — all NEW directories, so the
# pre-correction September artifacts under `results/climate_scenarios` and
# `results/sensitivity_obstacles` are preserved for comparison (a digest mismatch
# would otherwise overwrite them).
#
# E4 robust composition criterion: the 95th percentile of |Δ log N| is taken over
# the site × species cells whose density exceeds 0.1 density units (the project's
# presence threshold) in at least one of the two compared years, so near-extinct
# or flickering cells cannot dominate it.  `spin_up_composition_tol = 1e-2` was
# chosen from the real burn-in trajectory (the robust statistic crosses 1e-2 at
# ~yr 423, within the 600-year cap; the raw all-cells statistic plateaus near
# 1.4e-2 and never reaches 1e-3).  Both diagnostics are recorded in metadata.
#
# The corrected per-site water-temperature source
# (`guadex_tw/outputs/tables/water_temp_baseline_guadex_sites.csv`, exact column
# `tw_baseline_mean`) and the corrected interaction form
# (`interaction_inside_growth = true`) are CODE DEFAULTS with no configuration
# opt-in, so this file uses them by construction and cannot select the legacy
# alternatives.
#
# Run it with:
#   GUADEX_PARAMETERS_FILE=parameters_climate_scenarios_corrected.toml \
#     julia --project=. run_climate_scenarios.jl
# and, for the matching obstacle/interaction sweeps:
#   GUADEX_PARAMETERS_FILE=parameters_climate_scenarios_corrected.toml \
#     julia --project=. run_sensitivity_report.jl
#   GUADEX_PARAMETERS_FILE=parameters_climate_scenarios_corrected.toml \
#     julia --project=. run_alt_interactions.jl
#
# Do NOT use `legacy/parameters_climate_scenarios_k1x_burnin.toml` for corrected
# results: that file deliberately reproduces the September 2026 ensemble with
# the legacy `basin` stop rule and the pinned September slope, and must be used
# only to reproduce that legacy result.
# =============================================================================

[general]
# Time configuration: 1 time unit = 1 day.
days_per_year = 365

# ---------------------------------------------------------------------------
# Updated 2045 inputs shared by all scripts.
# ---------------------------------------------------------------------------

[inputs]
# CEDEX basin-level 2045 projection table (hydrological indicators, not
# temperatures).  Loaded for provenance and scenario selection.
cedex_var_file = "data/2045_CEDEX_GUADALQUIVIR_VAR.csv"

# CEDEX 2045 seasonal runoff projections per UTS.  Loaded for provenance and
# scenario selection.
cedex_esc_uts_file = "data/2045_CEDEX_GUADALQUIVIR_ESC_por_UTS.csv"

# 2026 inventory of obstacles that are not completely passable.
obstacles_file = "data/obstacles_1658_Obstaculos_No_Completamente_Franqueables _2026-02-16_Guadex.csv"

[obstacles]
# "legacy" disables the spatial obstacle overlay; "overlay" applies it.
mode = "overlay"

# Obstacles closer than this (metres) to a straight line segment between two
# connected sites are assigned to that segment.
matching_tolerance_m = 2000.0

# Passability applied to movement towards the higher-elevation (upstream) site.
# This is the limiting direction.
upstream_passability = 0.1

# Passability applied to movement towards the lower-elevation (downstream)
# site.  Reduced but more accessible than upstream.
downstream_passability = 0.5

# Barrier passability is currently modelled using a uniform structural
# assumption (0.1 upstream, 0.5 downstream) pending full standardisation of the
# regional obstacle inventory's qualitative passability index (IF).

# ---------------------------------------------------------------------------
# C4: dispersal-graph construction.  The corrected re-run selects the
# river-network tree rebuilt from the network-distance matrix (on-path parent
# rule + MST root join); `"legacy"` reproduces the artificial sub-catchment
# chaining used before the correction.
# ---------------------------------------------------------------------------
# Tolerance uses the code defaults (rtol = 0.02, atol = 200 m); see
# prepare_ode_data(on_path_rtol, on_path_atol).
[connectivity]
method = "on_path"

# ---------------------------------------------------------------------------
# Species groups used to classify simulation outputs.
#
# `native` includes ST (Salmo trutta), the cold-water keystone whose empirical
# thermal optimum (12 C, range 4-20 C) lies *below* current basin temperatures:
# it is the native species through which warming can appear as a decline.
# `migratory` holds the diadromous / estuarine species (AA, AAL, LR, MC) that are
# neither native-resident nor invasive; they are reported separately and are not
# part of the native richness metric.
# ---------------------------------------------------------------------------

[species]
native = ["AB", "AH", "SP", "PW", "LS", "SA", "IL", "CP", "IO", "ST"]
invasive = ["GH", "MS", "LG", "CC", "CG", "AM", "OM", "EL", "GL", "TT"]
migratory = ["AA", "AAL", "LR", "MC"]

# ---------------------------------------------------------------------------
# Biological-assumption options (E13-E16, E18) -- TEAM DECISIONS.
#
# These are the values the team chose for the corrected re-run.  They are made
# explicit here so the run metadata and the parameter digest record the resolved
# values.  `parameters.toml` deliberately RETAINS the safe legacy defaults, so
# the historical/legacy reproduction and the default test suite are unchanged;
# only a config that sets these keys (this file) opts in.  Rationale and
# trade-offs for each option are in docs/climate_scenarios.md.
# ---------------------------------------------------------------------------

[biological_options]
# E13 = 1.0: temperature/habitat decide establishment (no absent-site penalty).
absence_growth_fraction = 1.0
# E14 = "cap": clip the 84 isolated (EN_POZAS) pool sites at the non-pool median.
pool_capacity_mode = "cap"
# E15 = "near_zero": the 56 SIN_PECES = DIFICIL sites become transit-only (K=1e-6).
fishless_dificil_capacity = "near_zero"
# E16 = "zero": AA, LR, MC get local r = 0 (to be represented as immigration later).
nonreproducing_local_growth = "zero"
# E16 = true: drop the four documented Guadiato fish-farm eel records.
exclude_fishfarm_eel_records = true
# E18 = true: zero strictly brackish AB/LR/MC below the conductivity threshold.
# NO elevation envelope (deliberately omitted; see docs/climate_scenarios.md).
salinity_envelope = true

# ---------------------------------------------------------------------------
# Modelled subcatchments.  Exploitation and passability scenarios apply one
# factor per subcatchment; sites in unlisted subcatchments receive 1.0.
# ---------------------------------------------------------------------------

[subcatchments]
all = [1.1, 1.2, 1.3, 1.4, 2.2, 3.0, 6.0, 7.0, 9.0, 10.0, 11.3, 11.5, 11.2, 11.1, 11.4, 12.0, 13.3, 13.2, 13.1, 14.0, 15.2, 15.1, 16.0, 17.0, 18.1, 18.3, 18.2, 19.0, 20.0, 21.0, 22.1, 22.4, 22.2, 23.0, 24.1, 24.2, 25.0, 26.1, 26.2, 26.3, 26.4, 26.5, 26.6, 27.0, 28.1, 28.2, 28.3, 28.4, 29.0, 30.1, 30.2, 30.3, 30.4, 30.5, 30.6, 30.7, 31.0, 32.4, 32.3, 32.1, 32.2, 33.0, 34.1, 34.2, 34.3, 34.4, 35.0, 36.1, 36.2, 36.3, 36.4, 37.0, 38.0, 39.0, 40.1, 40.2, 41.0]

# ---------------------------------------------------------------------------
# Scenario library.
#
# Exploitation scenarios: factors < 1.0 reduce the intrinsic growth rate of a
# site (harvesting/mortality); 1.0 = no exploitation (baseline).
# Passability scenarios: multipliers applied to the dam/obstacle passability of
# a site; 1.0 = baseline, > 1.0 = improved passage, < 1.0 = reduced passage.
#
# A scenario has a uniform `factor` applied to every subcatchment and may add a
# per-subcatchment `overrides` table for heterogeneous scenarios, e.g.
#
#   [scenarios.exploitation.fish_refuge]
#   factor = 1.0
#   [scenarios.exploitation.fish_refuge.overrides]
#   "3.1" = 0.7
#   "4.2" = 0.5
# ---------------------------------------------------------------------------

[scenarios.exploitation]
baseline = { factor = 1.0 }
low_exploitation = { factor = 0.9 }
medium_exploitation = { factor = 0.7 }
high_exploitation = { factor = 0.5 }
example_exploitation = { factor = 0.9 }

[scenarios.passability]
baseline = { factor = 1.0 }
improved_passability = { factor = 1.5 }
reduced_passability = { factor = 0.5 }
blocked = { factor = 0.1 }
example_passability = { factor = 1.0 }

# ---------------------------------------------------------------------------
# Entry script settings.
#
# Each maintained entry script reads its own section.  The sensitivity scripts
# sweep over the listed grids and scenario names; run_model.jl applies a single
# exploitation and passability scenario.
# ---------------------------------------------------------------------------

[run_model]
simulation_years = 1
upstream_cost = 0.05
exploitation_scenario = "example_exploitation"
passability_scenario = "example_passability"

[run_sensitivity]
simulation_years = 1
upstream_costs = [0.01, 0.05, 0.1, 0.5]
exploitation_scenarios = ["baseline", "low_exploitation", "medium_exploitation", "high_exploitation"]
passability_scenarios = ["baseline", "improved_passability", "reduced_passability", "blocked"]

# ---------------------------------------------------------------------------
# Obstacle / upstream-cost sensitivity: shared climate-consistent settings.
#
# These reproduce the `climate_scenarios_k1x_burnin` configuration (per-GCM
# daily water temperature, seasonal baseline burn-in, calibrated heat stress,
# effective K = 1x observed, WP0 species classification).  Both
# `run_sensitivity_report.jl` and `run_alt_interactions.jl` read this section,
# so the two sweeps are directly comparable.  Per-run overrides use the
# GUADEX_SENSITIVITY_* environment variables (and GUADEX_SPINUP_* for the cache).
# ---------------------------------------------------------------------------

[obstacle_sensitivity]
start_year = 2026
end_year = 2045
save_interval_days = 30.4167
presence_threshold = 0.1
daily_forcing_file = "guadex_tw/outputs/tables/water_temp_daily_guadex_sites_wide.csv"
baseline_period_start = 1986
baseline_period_end = 2005
carrying_capacity_base_scaling = 1.0
carrying_capacity_scaling = 1.0
thermal_optima_fraction = 0.5
spin_up = true
spin_up_max_years = 600
spin_up_tol = 5.0e-5
# E4 corrected stop rule: require BOTH the basin-total change and the robust
# active-cell composition change, as in [run_climate_scenarios].
spin_up_criterion = "both"
spin_up_composition_tol = 1.0e-2
spin_up_min_years = 10
spin_up_progress_every = 50
# C3: use the SAME interim projection route as [run_climate_scenarios] (observed
# start + `interim_spin_up_years` baseline years, E4 stop rule bypassed), so the
# sweeps initialise from the corrected climate run's state instead of a 600-year
# burn-in.  Absent, the sweeps keep the full-burnin default, so nothing else
# changes.  These two keys are read by `sensitivity_core.load_sensitivity_settings`.
projection_route = "interim_observed"
interim_spin_up_years = 3
heat_stress_enabled = true
heat_stress_calibrate = true
heat_stress_max_loss = 0.05
quasi_extinction_q = 0.1
quasi_extinction_persistence = 3
upstream_cost = 0.05
# Corrected obstacle sweep output root, distinct from the legacy September
# `results/sensitivity_obstacles` so those artifacts are preserved.
output_dir = "results/sensitivity_obstacles_corrected"

# The two temperature extremes of the 44-run climate ensemble, used as the
# background climate for every obstacle/passability combination.  Each entry is
# a scenario x GCM pair; the per-GCM daily files are read directly.
#
# C7 re-selection on the CORRECTED realised forcing
# (`select_climate_endpoints` on `realised_warming_2036_2045_mean_degc` in
# results/climate_scenarios_corrected/runs_index.csv) confirms this pair is still
# the coolest and warmest run: 0.180 degC (ssp126/IITM-ESM) and 1.292 degC
# (ssp245/UKESM1-0-LL).  The digits in the inline comments are the max-over-sites
# `warming_end_degc` proxy by 2045, kept for continuity with the September table.
climate_models = [
    { scenario = "ssp126", gcm = "IITM-ESM" },     # coolest run (0.28 degC proxy by 2045)
    { scenario = "ssp245", gcm = "UKESM1-0-LL" },  # warmest run (1.37 degC proxy by 2045)
]

# ---------------------------------------------------------------------------
# Obstacle / upstream-cost sweep (run_sensitivity_report.jl).
#
# Sweeps the upstream dispersal cost x passability scenario under each of the
# `obstacle_sensitivity.climate_models` above.  No exploitation is applied.
# ---------------------------------------------------------------------------

[run_sensitivity_report]
upstream_costs = [0.01, 0.05, 0.1, 0.5]
passability_scenarios = ["baseline", "improved_passability", "reduced_passability", "blocked"]

# ---------------------------------------------------------------------------
# Alternative-interaction sweep (run_alt_interactions.jl).
#
# Adds the interaction-matrix and thermal-sigma uncertainty axes on top of the
# same obstacle/upstream-cost sweep, so it answers "is the passability signal
# robust to the interaction structure / thermal breadth?".
# ---------------------------------------------------------------------------

[run_alt_interactions]
thermal_sigma_multiplier = 0.3
upstream_costs = [0.01, 0.5]
passability_scenarios = ["baseline", "improved_passability", "reduced_passability", "blocked"]
# Corrected alt-interaction output root, distinct from the legacy September
# `results/sensitivity_obstacles/alt_interactions` so those artifacts are
# preserved.  Absent, the legacy path (under the obstacle output root) is kept;
# `GUADEX_ALT_OUTPUT_DIR` still overrides.
output_dir = "results/alt_interactions_corrected"

# ---------------------------------------------------------------------------
# Climate-driven runs (run_climate_scenarios.jl).
#
# The simulation starts at the current year and integrates daily to `end_year`
# (BP horizon 2045), with a year-by-year warming trajectory interpolated from
# the guadex_tw water-temperature projections, for every GCM x SSP.  States are
# saved monthly (30 days) to keep outputs small while retaining annual and
# seasonal metrics.
# ---------------------------------------------------------------------------

[run_climate_scenarios]
start_year = 2026
end_year = 2045
# 365/12 = 30.4167 days, so monthly snapshots land exactly on year boundaries.
save_interval_days = 30.4167
elevation_scaling = false
presence_threshold = 0.1
upstream_cost = 0.05
# Generate the four-level / ensemble figures after the run (env GUADEX_CLIMATE_PLOT=0 disables).
make_figures = true
# Output root for the corrected runs (env GUADEX_CLIMATE_OUTPUT_DIR overrides).
# Deliberately distinct from the pre-correction September `results/climate_scenarios`
# so the September artifacts are preserved for comparison.
output_dir = "results/climate_scenarios_corrected"
temperature_projections_file = "guadex_tw/outputs/tables/water_temp_future_2045.csv"
scenarios = ["ssp126", "ssp245", "ssp370", "ssp585"]
gcms = [
    "ACCESS-CM2", "CMCC-CM2-SR5", "CNRM-ESM2-1", "EC-Earth3-Veg", "IITM-ESM",
    "KACE-1-0-G", "MIROC6", "MPI-ESM1-2-HR", "MRI-ESM2-0", "NorESM2-MM",
    "UKESM1-0-LL",
]

# --- WP2: forcing mode -----------------------------------------------------
# "annual_mean" reproduces the historical annual-node warming curve (default);
# "daily" uses a per-site daily water-temperature forcing file (WP1).
forcing_mode = "daily"
daily_forcing_file = "guadex_tw/outputs/tables/water_temp_daily_guadex_sites_wide.csv"
# Use the per-(scenario, GCM) wide files (<base>_<scenario>_<gcm>.csv) so the
# ensemble carries GCM spread instead of the ensemble-median product.
daily_forcing_per_gcm = true
# Baseline period for daily anomalies (PNACC convention).
baseline_period_start = 1986
baseline_period_end = 2005
# Add a no-warming control run (baseline climatology over the horizon) so
# scenario effects can be reported relative to it (WP4).
control_run = true

# --- C3: projection route ---------------------------------------------------
# The team chose the C3 INTERIM route: start projections from the OBSERVED
# community with only a short spin-up and report every scenario relative to the
# matched no-warming control, rather than from a long model-generated burn-in.
#
#   "full_burnin"      (default) integrate to the E4 convergence criteria below
#                      (basin + robust composition).  This remains the default
#                      when the key is absent, so other configs are unaffected.
#   "interim_observed" start from the observed snapshot, integrate exactly
#                      `interim_spin_up_years` baseline years, and report deltas
#                      against the control.  `control_run = true` is MANDATORY
#                      for this route (the runner errors otherwise).
projection_route = "interim_observed"
# Short relaxation from the observed snapshot (allowed 0-5 yr).  3 yr lets the
# fastest local/compositional transients relax while the state stays anchored to
# the observations; the residual common transient cancels in scenario-control.
interim_spin_up_years = 3

# --- WP4: spun-up initial conditions / carrying-capacity sensitivity --------
# Corrected re-run: stop only when BOTH the basin-total relative change (below
# `spin_up_tol`) and the robust composition change (95th percentile of |Δ log N|
# over site × species cells above the 0.1-unit presence floor in at least one of
# the two compared years, below `spin_up_composition_tol`) hold for at least
# `spin_up_min_years` one-year blocks (E4).
spin_up = true
spin_up_max_years = 600
spin_up_tol = 5.0e-5
# Stop rule for the burn-in: "both" = basin + robust composition (corrected, E4);
# "basin" reproduces the legacy September rule.
spin_up_criterion = "both"
# 1e-2: robust statistic crosses this at ~yr 423 on real data (<600 cap); the raw
# all-cells statistic plateaus near 1.4e-2 and never reaches 1e-3.
spin_up_composition_tol = 1.0e-2
spin_up_min_years = 10
# Print a burn-in progress line every N year-blocks (0 disables).
spin_up_progress_every = 50
# Multiplier linking observed total density to the base carrying capacity
# (build_carrying_capacity).  10.0 = legacy "10x observed"; 1.0 = the observed
# snapshot is the capacity level.  The effective multiplier is
# carrying_capacity_base_scaling * carrying_capacity_scaling.
carrying_capacity_base_scaling = 1.0
carrying_capacity_scaling = 1.0
# WP3 optimum sweep: 0.0 = cold edge, 0.5 = midpoint (default), 1.0 = warm edge.
thermal_optima_fraction = 0.5

# --- WP5: quasi-extinction --------------------------------------------------
quasi_extinction_q = 0.1
quasi_extinction_persistence = 3

# [temperature_stress] below controls WP3: when `enabled = false` the ODE is the
# pre-WP3 model regardless of `k`.

# ---------------------------------------------------------------------------
# WP3 heat-stress mortality.  `k` is the single shared slope (1/day/degC^2);
# `enabled = false` disables the term (and preserves the old model).  When
# `calibrate = true` the run script derives `k` from the baseline exceedance
# energy so that the worst observed baseline species/site loses at most
# `max_annual_loss` per year.
# ---------------------------------------------------------------------------

[temperature_stress]
# Corrected re-run: heat stress enabled and the shared slope derived from the
# corrected per-site water-temperature baseline and the empirical upper limits
# (`calibrate = true`), so it is consistent with the corrected temperature
# series.  The September run pinned this slope for exact reproduction; see
# `legacy/parameters_climate_scenarios_k1x_burnin.toml`.
enabled = true
k = 0.0
calibrate = true
max_annual_loss = 0.05
limits_source = "trait_table"

# ---------------------------------------------------------------------------
# Staged experiment driver (run_climate_experiments.jl, WP6).
#
# Stages, cheapest first; each stage gates the next:
#   E0 spinup     - spun-up state vs observed (realism check)
#   E1 seasonality- baseline annual-mean vs daily forcing
#   E2 heat       - heat-stress on/off
#   E3 k          - carrying-capacity sensitivity {1x, 3x, 10x}
#   E4 optimum    - thermal-optimum sweep across the empirical range
#   E5 ensemble   - full GCM x SSP run (delegated to run_climate_scenarios.jl)
# ---------------------------------------------------------------------------

[run_climate_experiments]
stages = ["E0", "E1", "E2", "E3", "E4"]
start_year = 2026
end_year = 2045
scenario = "ssp585"
gcms = ["ACCESS-CM2", "CMCC-CM2-SR5", "CNRM-ESM2-1", "EC-Earth3-Veg", "IITM-ESM",
    "KACE-1-0-G", "MIROC6", "MPI-ESM1-2-HR", "MRI-ESM2-0", "NorESM2-MM",
    "UKESM1-0-LL"]
# E3 carrying-capacity multipliers and E4 optimum positions within the range.
# The effective multiplier against observed density is
# carrying_capacity_base_scaling * k_scaling_grid[k], and both are recorded per case.
carrying_capacity_base_scaling = 10.0
k_scaling_grid = [1.0, 3.0, 10.0]
optimum_fractions = [0.0, 0.25, 0.5, 0.75, 1.0]
spin_up_max_years = 50
spin_up_tol = 1.0e-6
# E4 corrected stop rule for the staged driver (basin + robust composition).
spin_up_criterion = "both"
spin_up_composition_tol = 1.0e-2
spin_up_min_years = 10
output_dir = "results/climate_experiments"
temperature_projections_file = "guadex_tw/outputs/tables/water_temp_future_2045.csv"
daily_forcing_file = "guadex_tw/outputs/tables/water_temp_daily_guadex_sites_wide.csv"
